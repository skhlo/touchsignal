[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "touchsignal"
version = "0.0.0"
description = "Omarchy-aware Touch Bar HUD for agent workflows"
requires-python = ">=3.12"
readme = "README.md"

[project.scripts]
touchsignal-touchbar-owner = "touchbar_owner.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
